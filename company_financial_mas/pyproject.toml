[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
root = "../"

[project]
name = "company_financial_mas"
version = "0.1.0"
authors = [
    {name = "Vincent Ren", email = "vren@andrew.cmu.edu"},
]
description = "Company Financial Multi-Agent System using AIQ toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "aiqtoolkit[langchain]",
    "langchain",
    "langchain-core",
    "langgraph>=0.0.10",
    "pydantic",
    "pandas>=2.0.0",
    "numpy",
    "matplotlib",
    "seaborn",
    "plotly",
    "python-dotenv",
    "psycopg2-binary>=2.9.0",
    "flask>=3.0.0",
]


[tool.uv.sources]
aiqtoolkit = { path = "../", editable = true }

[project.entry-points."aiq.plugins"]
company_financial_mas = "company_financial_mas.register"