[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq_financial_mas"
version = "0.1.0"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
description = "A financial multi-agent system for company financial analysis using NVIDIA AIQ"
requires-python = ">=3.8"
dependencies = [
    "aiq",
    "pandas",
    "numpy",
    "pydantic",
    "python-dotenv",
    "sqlalchemy",
    "networkx",
    "matplotlib",
    "seaborn",
    "pinecone-client",
    "motor",
    "asyncpg",
    "tenacity",
    "pyyaml",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
]

[tool.setuptools]
packages = ["aiq_financial_mas"] 