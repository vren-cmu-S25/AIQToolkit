# Default configuration for financial analysis agents

# LLM Configuration
llm:
  name: "gpt-4"
  temperature: 0.7
  max_tokens: 2000

# Agent Configuration
agents:
  controller:
    enabled: true
    test_mode: true
    max_retries: 3
    timeout: 300  # seconds

  profitability:
    enabled: true
    test_mode: true
    metrics:
      - gross_profit_margin
      - operating_profit_margin
      - net_profit_margin
      - return_on_assets
      - return_on_equity
    benchmarks:
      industry_average: true
      historical_comparison: true

# Database Configuration
database:
  type: "sqlite"  # or "postgresql", "mysql", etc.
  test_mode: true
  path: "data/financial_data.db"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/financial_analysis.log"

# Analysis Configuration
analysis:
  default_time_period: "last_quarter"
  supported_periods:
    - "last_week"
    - "last_month"
    - "last_quarter"
    - "last_year"
    - "ytd"
  visualization:
    enabled: true
    format: "png"
    style: "seaborn" 