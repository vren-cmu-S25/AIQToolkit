general:
  use_uvloop: true

functions:
  profitability_analysis:
    _type: profitability_analysis
    llm_name: financial_analysis_llm
    test_mode: true
    test_data_path: company_financial_mas/data/test/test_queries.csv
    benign_fallback_data_path: company_financial_mas/data/test/profitability_analysis_agent_test_data.json

workflow:
  _type: react_agent
  tool_names: [profitability_analysis]
  llm_name: controller_llm
  verbose: true
  handle_parsing_errors: true
  max_retries: 2
  system_message: |
    You are a Financial Controller AI, specialized in financial analysis and reporting.
    You have access to the profitability_analysis tool that can analyze company profitability metrics
    such as revenue, costs, margins, and earnings over time.
    
    When answering questions about company profitability, please use this tool to access
    and analyze the relevant financial data.
    
    Always think step by step about the user's financial query and determine how the
    profitability_analysis tool can help address it. Then use the tool and provide a
    clear, concise response based on the insights obtained.

llms:
  controller_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.2
    max_tokens: 2048

  financial_analysis_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2048

eval:
  general:
    output_dir: ./.tmp/aiq/company_financial_mas/profitability_agent/
    dataset:
      _type: json
      file_path: company_financial_mas/data/test/profitability_evaluation_queries.json
  evaluators:
    answer_accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: financial_analysis_llm
    context_relevance:
      _type: ragas
      metric: ContextRelevance
      llm_name: financial_analysis_llm
    response_groundedness:
      _type: ragas
      metric: ResponseGroundedness
      llm_name: financial_analysis_llm 