# Database Configuration for Financial MAS

# Vector Database (Pinecone/Weaviate)
vector_db:
  type: "pinecone"  # or "weaviate"
  api_key: "${VECTOR_DB_API_KEY}"
  environment: "us-west1-gcp"
  index_name: "financial_insights"
  dimension: 1536  # for OpenAI embeddings
  metric: "cosine"
  namespace: "financial_analysis"

# TimescaleDB Configuration
timescale_db:
  host: "${TIMESCALE_DB_HOST}"
  port: 5432
  database: "financial_metrics"
  user: "${TIMESCALE_DB_USER}"
  password: "${TIMESCALE_DB_PASSWORD}"
  ssl_mode: "require"
  connection_pool:
    min_connections: 1
    max_connections: 10
  retention_policy:
    data_retention: "1 year"
    continuous_aggregates: true

# Document Database (MongoDB)
document_db:
  uri: "${MONGODB_URI}"
  database: "financial_documents"
  collections:
    reports: "financial_reports"
    analysis: "financial_analysis"
    metadata: "document_metadata"
  indexes:
    - field: "timestamp"
      type: "descending"
    - field: "document_type"
      type: "ascending"
    - field: "tags"
      type: "text"
  write_concern:
    w: "majority"
    wtimeout: 5000
  read_preference: "secondaryPreferred"

# Common Settings
common:
  timeout: 30  # seconds
  retry_attempts: 3
  retry_delay: 1  # seconds
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "logs/database_operations.log"

# Test Mode Settings
test_mode:
  enabled: true
  vector_db:
    index_name: "test_financial_insights"
    namespace: "test_financial_analysis"
  timescale_db:
    database: "test_financial_metrics"
  document_db:
    database: "test_financial_documents" 