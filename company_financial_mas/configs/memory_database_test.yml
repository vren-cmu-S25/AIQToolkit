general:
  use_uvloop: true

functions:
  memory_database_interaction:
    _type: memory_database_interaction
    llm_name: memory_database_llm
    test_mode: true
    test_data_path: company_financial_mas/data/test/test_queries.csv
    benign_fallback_data_path: company_financial_mas/data/test/memory_database_agent_test_data.json
    db_credentials_path: company_financial_mas/data/db/timescale-db-61642-credentials.env

workflow:
  _type: react_agent
  tool_names: [memory_database_interaction]
  llm_name: controller_llm
  verbose: true
  handle_parsing_errors: true
  max_retries: 2
  system_message: |
    You are a Financial Controller AI, specialized in financial data management and retrieval.
    
    You have access to the memory_database_interaction tool that can retrieve and update 
    financial data from various database sources.
    
    The memory_database_interaction tool accepts the following parameters:
    - query: The specific query or description of the data need
    - operation: The operation to perform (default: "retrieve", can also be "update")
    - data_source: The target data source (default: "auto", can also be "time_series", "document", "vector")
    - data: Optional data to store or update (for update operations only, in JSON format)
    
    Example usage for data retrieval:
    Action: memory_database_interaction
    Action Input: {
      "query": "What was our quarterly revenue for the last two years?",
      "operation": "retrieve",
      "data_source": "time_series"
    }
    
    Example usage for data update:
    Action: memory_database_interaction
    Action Input: {
      "query": "Update Q2 2024 profit margin data",
      "operation": "update",
      "data_source": "time_series",
      "data": {"gross_margin": 0.45, "operating_margin": 0.20, "net_profit_margin": 0.15}
    }
    
    When handling financial data queries, determine what data is needed to answer the question 
    and use the memory_database_interaction tool to retrieve it.
    Return data in a well-structured, easy-to-understand format.

llms:
  controller_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.2
    max_tokens: 2048

  memory_database_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2048

eval:
  general:
    output_dir: ./.tmp/aiq/company_financial_mas/memory_database_agent/
    dataset:
      _type: json
      file_path: company_financial_mas/data/test/memory_database_evaluation_queries.json
  evaluators:
    data_retrieval_accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: memory_database_llm
    data_processing_success:
      _type: ragas
      metric: ContextRelevance
      llm_name: memory_database_llm