general:
  use_uvloop: true

functions:
  query_understanding_planning:
    _type: query_understanding_planning
    llm_name: planning_llm
    test_mode: false
  
  profitability_analysis:
    _type: profitability_analysis
    llm_name: financial_analysis_llm
    test_mode: false
  
  liquidity_analysis:
    _type: liquidity_analysis
    llm_name: financial_analysis_llm
    test_mode: false
  
  efficiency_analysis:
    _type: efficiency_analysis
    llm_name: financial_analysis_llm
    test_mode: false
  
  risk_leverage_analysis:
    _type: risk_leverage_analysis
    llm_name: financial_analysis_llm
    test_mode: false
  
  growth_analysis:
    _type: growth_analysis
    llm_name: financial_analysis_llm
    test_mode: false
  
  memory_database_agent:
    _type: memory_database_agent
    llm_name: database_llm
    test_mode: false
    vector_db_connection: ${VECTOR_DB_CONNECTION}
    timeseries_db_connection: ${TIMESERIES_DB_CONNECTION}
    document_db_connection: ${DOCUMENT_DB_CONNECTION}
  
  insight_aggregation:
    _type: insight_aggregation
    llm_name: insight_llm
    test_mode: false
  
  response_generation:
    _type: response_generation
    llm_name: response_llm
    test_mode: false

workflow:
  _type: financial_controller_agent
  tool_names:
    - query_understanding_planning
    - profitability_analysis
    - liquidity_analysis
    - efficiency_analysis
    - risk_leverage_analysis
    - growth_analysis
    - memory_database_agent
    - insight_aggregation
    - response_generation
  llm_name: controller_llm
  test_mode: false

llms:
  controller_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.2
    max_tokens: 2048

  planning_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.1
    max_tokens: 1024

  financial_analysis_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2048

  database_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2048
  
  insight_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.1
    max_tokens: 2048

  response_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.3
    max_tokens: 2048 